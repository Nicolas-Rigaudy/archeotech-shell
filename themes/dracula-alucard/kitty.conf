# vim:ft=kitty

## name:     Archeotech Alucard (dracula)
## author:   Archeotech (theme-switch)
## blurb:    Light flavor for the dracula family — Sprint 25.

# The basic colors
foreground              #1f1f1f
background              #fffbeb
selection_foreground    #fffbeb
selection_background    #644ac9

# Cursor colors

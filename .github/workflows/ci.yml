name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts — syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            head -1 "$f" | grep -qE 'bash|sh' || continue
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done < <(find scripts -name '*.sh')
          exit $fail

      - name: Python — compile check
        run: python3 -m py_compile scripts/theme-switch.py

      - name: JSON — validate config + theme + module manifests
        run: |
          fail=0
          for f in shell-config.json drawer-config.json \
                   themes/*/theme.json modules/*/module.json; do
            [ -e "$f" ] || continue
            python3 -c "import json,sys; json.load(open('$f'))" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done
          exit $fail

  # QML in an Arch container: quickshell is in [extra], so qmllint sees the real
  # Quickshell types. Renders (mango is AUR-only) stay local for now via
  # scripts/golden.sh; a render smoke + golden diff job follows once a cached
  # image with mango exists.
  qml:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Qt6 + Quickshell
        run: pacman -Syu --noconfirm --needed quickshell qt6-declarative python git

      - uses: actions/checkout@v4

      - name: qmllint (Qt6) — fails on syntax errors, counts the rest
        run: python3 scripts/qmllint-ci.py

      - name: QML logic tests (qmltestrunner)
        run: tests/run.sh

      - name: Theme token contrast (informational)
        run: python3 scripts/contrast-check.py
